<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title description">
  <title id="title">SimpleYTDownloader</title>
  <desc id="description">A dark charcoal and coral banner for the Windows desktop app: MP4 video, MP3 audio, and built-in updates.</desc>
  <defs>
