      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ff8868" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8868" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffb591"/>
      <stop offset="1" stop-color="#ff775a"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="338" rx="26" fill="url(#background)" stroke="#30343d" stroke-width="2"/>
  <ellipse cx="1040" cy="162" rx="240" ry="174" fill="url(#glow)"/>
