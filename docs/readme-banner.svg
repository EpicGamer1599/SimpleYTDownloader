    <text x="48" y="142" fill="#f2f3f5" font-size="56" font-weight="700" letter-spacing="-1.6">SimpleYTDownloader</text>
    <text x="50" y="187" fill="#a6acb8" font-size="22">Your videos. Your audio. One simple desktop app.</text>
    <g font-size="13" font-weight="600">
